<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources — Catalyst Solutions Services</title>
<script src="partials.js"></script>
</head>
<body>
<div id="nav" data-active="resources"></div>

<section style="position:relative; padding:84px 32px 48px; overflow:hidden;">
  <div style="position:absolute; inset:0; background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124,58,237,0.24), transparent 65%); pointer-events:none;"></div>
  <div style="position:relative; max-width:820px; margin:0 auto; text-align:center;">
    <div style="display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border-radius:100px; background:rgba(124,58,237,0.12); border:1px solid rgba(168,85,247,0.28); margin-bottom:24px;">
      <span style="width:6px; height:6px; border-radius:50%; background:#A855F7; box-shadow:0 0 10px #A855F7;"></span>
      <span style="font-size:12.5px; font-weight:500; color:#C4B5FD;">Resources & Insights</span>
    </div>
    <h1 style="font-size:52px; font-weight:800; line-height:1.08; letter-spacing:-0.03em; color:#fff; margin:0 0 20px;">Ideas to Help You Grow Smarter</h1>
    <p style="font-size:17.5px; line-height:1.62; color:#9CA3AF; margin:0;">Practical thinking on strategy, AI, websites, search, ads, content, and the systems behind sustainable growth.</p>
  </div>
</section>

<section style="padding:8px 32px 40px;">
  <div id="categories" style="max-width:1240px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
</section>

<section style="padding:16px 32px 96px;">
  <div id="posts" style="max-width:1240px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:20px;"></div>
</section>

<div id="cta" data-eyebrow="Beyond the blog" data-heading="Want a Plan Built for Your Business?" data-copy="Reading is a start. A short consultation turns these ideas into a roadmap tailored to your goals." data-button="Book a Growth Consultation"></div>
<div id="footer"></div>

<script>
const ms = "font-family:'Material Symbols Outlined';";
const purple='linear-gradient(135deg,#4C1D95,#7C3AED)', blue='linear-gradient(135deg,#1E3A8A,#3B82F6)', violet='linear-gradient(135deg,#5B21B6,#A855F7)';
const categories = [
  {name:'Digital Growth Strategy', icon:'strategy'},{name:'AI Automation', icon:'smart_toy'},{name:'Website Conversion', icon:'ads_click'},
  {name:'SEO & AI Search', icon:'travel_explore'},{name:'Paid Ads', icon:'campaign'},{name:'Social Media Growth', icon:'share'},
  {name:'Ecommerce Growth', icon:'shopping_cart'},{name:'Analytics & Reporting', icon:'monitoring'},{name:'Local Business Growth', icon:'location_on'},
];
const posts = [
  {category:'Digital Growth Strategy', icon:'strategy', bg:purple, title:"Why Your Growth Stalls When Your Systems Don't Talk to Each Other", excerpt:'The hidden cost of disconnected tools — and how to think about growth as one system.', read:'7 min read'},
  {category:'AI Automation', icon:'smart_toy', bg:violet, title:'Where AI Actually Adds Leverage in a Growth System', excerpt:"A grounded look at the automation that moves the needle versus the hype that doesn't.", read:'6 min read'},
  {category:'Website Conversion', icon:'ads_click', bg:blue, title:'The Anatomy of a Landing Page That Converts', excerpt:'The structural choices that separate pages that capture leads from ones that lose them.', read:'8 min read'},
  {category:'SEO & AI Search', icon:'travel_explore', bg:purple, title:'Getting Found in the Age of AI Search', excerpt:'How AEO and GEO change the way you should think about organic visibility.', read:'9 min read'},
  {category:'Paid Ads', icon:'campaign', bg:violet, title:'How to Scale Ad Spend Without Lighting Money on Fire', excerpt:'The tracking and testing foundation that makes paid media a predictable investment.', read:'7 min read'},
  {category:'Social Media Growth', icon:'share', bg:blue, title:'Consistency Beats Virality: A Realistic Content System', excerpt:'Why a sustainable content rhythm outperforms chasing the occasional viral hit.', read:'5 min read'},
  {category:'Ecommerce Growth', icon:'shopping_cart', bg:purple, title:'Small Conversion Wins That Compound Into Real Revenue', excerpt:'Where to look first when you want to lift revenue per visitor in your store.', read:'6 min read'},
  {category:'Analytics & Reporting', icon:'monitoring', bg:violet, title:'The Few Metrics That Actually Deserve a Dashboard', excerpt:'Cut through vanity numbers and track what genuinely drives decisions.', read:'5 min read'},
  {category:'Local Business Growth', icon:'location_on', bg:blue, title:'Winning the Local Map Pack: A Practical Playbook', excerpt:'The profile, review, and SEO moves that put local businesses in front of nearby buyers.', read:'7 min read'},
];
document.getElementById('categories').innerHTML = categories.map(c => `
  <span data-hover style="display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:100px; background:rgba(255,255,255,0.04); border:1px solid rgba(168,85,247,0.18); font-size:13px; font-weight:500; color:#C4B5FD;"><span style="${ms} font-size:16px;">${c.icon}</span>${c.name}</span>`).join('');
document.getElementById('posts').innerHTML = posts.map(p => `
  <a href="Contact.html" class="lift" data-hover style="display:block; border-radius:16px; overflow:hidden; background:linear-gradient(160deg,rgba(24,19,42,0.75),rgba(12,11,22,0.75)); border:1px solid rgba(255,255,255,0.07); text-decoration:none;">
    <div style="position:relative; height:130px; background:${p.bg}; overflow:hidden;">
      <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px); background-size:24px 24px;"></div>
      <span style="position:absolute; bottom:12px; right:14px; ${ms} font-size:40px; color:rgba(255,255,255,0.8);">${p.icon}</span>
    </div>
    <div style="padding:22px;">
      <div style="font-size:11.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#A78BCF; margin-bottom:10px;">${p.category}</div>
      <h3 style="font-size:16.5px; font-weight:600; line-height:1.34; color:#fff; margin:0 0 10px;">${p.title}</h3>
      <p style="font-size:13px; line-height:1.55; color:#8B8B9A; margin:0 0 14px;">${p.excerpt}</p>
      <span style="font-size:12px; color:#6B6B7A;">${p.read}</span>
    </div>
  </a>`).join('');
</script>
</body>
</html>
