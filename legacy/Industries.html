<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industries — Catalyst Solutions Services</title>
<script src="partials.js"></script>
</head>
<body>
<div id="nav" data-active="industries"></div>

<section style="position:relative; padding:84px 32px 56px; overflow:hidden;">
  <div style="position:absolute; inset:0; background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124,58,237,0.24), transparent 65%); pointer-events:none;"></div>
  <div style="position:relative; max-width:820px; margin:0 auto; text-align:center;">
    <div style="display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border-radius:100px; background:rgba(124,58,237,0.12); border:1px solid rgba(168,85,247,0.28); margin-bottom:24px;">
      <span style="width:6px; height:6px; border-radius:50%; background:#A855F7; box-shadow:0 0 10px #A855F7;"></span>
      <span style="font-size:12.5px; font-weight:500; color:#C4B5FD;">Industries We Serve</span>
    </div>
    <h1 style="font-size:52px; font-weight:800; line-height:1.08; letter-spacing:-0.03em; color:#fff; margin:0 0 20px;">Growth Systems Tailored to Your Industry</h1>
    <p style="font-size:17.5px; line-height:1.62; color:#9CA3AF; margin:0;">Every market is different. We adapt strategy, channels, and execution to the realities of how your industry actually buys and grows.</p>
  </div>
</section>

<section style="padding:40px 32px 96px;">
  <div id="industries" style="max-width:1240px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:18px;"></div>
</section>

<div id="cta" data-eyebrow="Built for your market" data-heading="Let's Build a Plan for Your Industry" data-copy="Tell us about your business and we'll map a growth approach suited to how your market actually works." data-button="Book a Growth Consultation"></div>
<div id="footer"></div>

<script>
const ms = "font-family:'Material Symbols Outlined';";
const industries = [
  {icon:'cloud', title:'SaaS & Technology', desc:'Demand generation, product-led funnels, and content that turns trials into paying, retained customers.'},
  {icon:'shopping_cart', title:'Ecommerce', desc:'Store optimization, paid acquisition, and retention systems that grow revenue per visitor and order.'},
  {icon:'storefront', title:'Local Businesses', desc:'Local SEO, reviews, and a strong Google presence that turns nearby searches into walk-in customers.'},
  {icon:'medical_services', title:'Healthcare & Clinics', desc:'Trust-building websites, local visibility, and compliant lead systems that fill your appointment book.'},
  {icon:'gavel', title:'Professional Services', desc:'Authority content, targeted ads, and clear funnels that generate qualified, high-value inquiries.'},
  {icon:'self_improvement', title:'Coaches & Consultants', desc:'Personal brand, lead magnets, and nurture automation that fill your calendar with ideal clients.'},
  {icon:'home_work', title:'Real Estate', desc:'Lead capture, local SEO, and follow-up automation that keep your pipeline full and responsive.'},
  {icon:'school', title:'Education & Training', desc:'Enrollment funnels, content marketing, and ad campaigns that grow student and learner demand.'},
  {icon:'rocket_launch', title:'Startups', desc:'Brand, MVP, and go-to-market systems that help you validate, launch, and scale with momentum.'},
  {icon:'handshake', title:'B2B Service Companies', desc:'Account-based campaigns, LinkedIn growth, and pipeline systems built for longer sales cycles.'},
];
document.getElementById('industries').innerHTML = industries.map(i => `
  <div class="lift" data-hover style="padding:28px; border-radius:16px; background:linear-gradient(160deg,rgba(24,19,42,0.75),rgba(12,11,22,0.75)); border:1px solid rgba(255,255,255,0.07);">
    <span style="display:flex; width:50px; height:50px; align-items:center; justify-content:center; border-radius:13px; background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(168,85,247,0.1)); border:1px solid rgba(168,85,247,0.25); color:#C4B5FD; ${ms} font-size:26px; margin-bottom:18px;">${i.icon}</span>
    <h3 style="font-size:18px; font-weight:600; color:#fff; margin:0 0 10px;">${i.title}</h3>
    <p style="font-size:14px; line-height:1.6; color:#8B8B9A; margin:0;">${i.desc}</p>
  </div>`).join('');
</script>
</body>
</html>
